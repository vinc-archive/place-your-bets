<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1. Счастливчик — Place Your Bets</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d0c;
      --bg-felt: #101915;
      --card-bg: #121514;
      --gold: #d4af37;
      --gold-dim: rgba(212, 175, 55, 0.25);
      --text-main: #e4e1d8;
      --text-muted: #8c8a82;
      --border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-felt) 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #8a6d1c, var(--gold));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease-out;
    }
    .main-wrapper {
      width: 100%;
      max-width: 680px;
      padding: 64px 24px 96px;
    }
    .top-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-brand a {
      text-decoration: none;
      color: var(--gold);
    }
    .chapter-meta {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .chapter-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 44px;
      font-weight: 600;
      line-height: 1.15;
      color: #f5f2eb;
      margin-bottom: 38px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .chapter-body {
      font-size: 18px;
      line-height: 1.8;
      color: var(--text-main);
    }
    .scene-block {
      margin-bottom: 32px;
    }
    .scene-block p {
      margin-bottom: 14px;
    }
    .scene-divider {
      text-align: center;
      color: var(--gold);
      opacity: 0.45;
      font-size: 14px;
      letter-spacing: 0.6em;
      margin: 28px 0;
    }
    .chapter-footer {
      margin-top: 64px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .nav-btn.primary {
      border-color: var(--gold-dim);
      color: var(--gold);
    }
    .nav-btn:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
      background: rgba(212, 175, 55, 0.08);
    }
    @media (max-width: 640px) {
      .main-wrapper {
        padding: 40px 20px 72px;
      }
      .chapter-title {
        font-size: 36px;
      }
      .chapter-body {
        font-size: 16.5px;
        line-height: 1.72;
      }
      .chapter-footer {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
    }
    @media print {
      body { display: none !important; }
    }
  </style>
</head>
<body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" ondragstart="return false;">

  <div class="progress-bar" id="progressBar"></div>

  <main class="main-wrapper">
    <div class="top-brand">
      <div><a href="index.html">Place Your Bets</a> · VIP Table № 4</div>
      <div>by vinc-archive</div>
    </div>

    <div class="chapter-meta">Глава I</div>
    <h1 class="chapter-title">1. Счастливчик</h1>

    <div class="chapter-body" id="chapterBody"></div>

    <div class="chapter-footer">
      <a href="index.html" class="nav-btn">← К содержанию</a>
      <a href="chapter-2.html" class="nav-btn primary">2. Ставка →</a>
    </div>
  </main>

  <textarea id="rawText" style="display:none;">
ВСТАВЬ СЮДА ТЕКСТ ГЛАВЫ
  </textarea>

  <script>
    var raw = document.getElementById('rawText').value;
    var blocks = raw.trim().split(/\n\s*\n/);
    var html = '';

    for (var i = 0; i < blocks.length; i++) {
      var lines = blocks[i].split('\n');
      var paragraphs = '';
      for (var j = 0; j < lines.length; j++) {
        var line = lines[j].trim();
        if (!line) continue;
        var formattedLine = line.replace(/\*(.*?)\*/g, '<em>$1</em>');
        paragraphs += '<p>' + formattedLine + '</p>';
      }
      var divider = i < blocks.length - 1 ? '<div class="scene-divider">• • •</div>' : '';
      html += '<div class="scene-block">' + paragraphs + '</div>' + divider;
    }

    document.getElementById('chapterBody').innerHTML = html;

    window.addEventListener('scroll', function() {
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = progress + '%';
    });

    document.addEventListener('keydown', function(e) {
      if (
        (e.ctrlKey || e.metaKey) &&
        ['c', 'C', 'с', 'С', 'a', 'A', 'ф', 'Ф', 's', 'S', 'ы', 'Ы', 'u', 'U', 'г', 'Г', 'p', 'P', 'з', 'З'].indexOf(e.key) !== -1
      ) {
        e.preventDefault();
      }
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].indexOf(e.key.toUpperCase()) !== -1)) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
