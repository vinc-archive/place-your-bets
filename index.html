  <template id="text-1">
Макс терпеть не мог проигрывать. Особенно тогда, когда кому-то другому везло больше, чем ему.
Особенно, когда рядом сидел сам Джордж Расселл: этот чёртов самодовольный британец, устроившийся за бархатным столом с лицом человека, которому судьба задолжала ещё пару выигрышей.
Рядом с ним, абсолютно расслабленно развалившись на диване, сидел ещё один британец – Ландо. Его вечное присутствие напоминало скорее фоновый шум в баре, чем серьёзную игру. Норрис лениво гонял по дну стакана кубики льда, будто происходящее за столом было лучшим бесплатным шоу вечера. Он явно собирался проиграть пару тысяч просто веселья ради.
Воздух в VIP-зале пропах дорогим табаком, эксклюзивным парфюмом, от которого у Макса уже начинала болеть голова, и напряжением, способным плавить металл.
Джордж сидел расслабленно, машинально прокручивая на пальце тонкий серебристый перстень. Он лениво откинулся на спинку кожаного дивана, бросая на стол фишки так легко, будто это были не тысячи, а фантики от конфет.
На долю секунды, как только Расселл делал очередную рискованную ставку на одинарный zero – упорно игнорируя соседний двойной ноль – крупье за столом, Пьер, едва заметно скривил губы, словно выпад Расселла казался ему верхом самонадеянности. Ну конечно, крупье ведь часто видывали подобные сценарии... Так ведь?
Колесо закрутилось.
И всё же Макс был готов поклясться, что крупье задержал взгляд на ставке Расселла на долю секунды дольше, чем следовало.
Этого было недостаточно, чтобы обвинить кого-либо. Но достаточно, чтобы чувство неправильности впилось под кожу.

С каждой новой победой аккуратная башня разноцветных фишек перед британцем становилась всё выше, постепенно превращаясь в откровенное издевательство.
Макс с ненавистью уставился на россыпь фишек, которых осталось слишком мало.
Он ведь специально сел рядом с Джорджем. Специально предложил играть вместе. Специально собирался доказать, что способен не уступать ему ни в чём.
Но спустя три часа единственным, что он доказал, была удивительная способность проигрывать. Вместо восхищения он получал лишь стремительно худеющий кошелёк и абсолютное равнодушие.
– Если тебя утешит, – Ландо лениво покрутил бокал, – ты сегодня хотя бы держишься очень стабильно.
Макс молча покосился на него.
– Стабильно проигрываешь.
Норрис громко хмыкнул в самый неподходящий момент – как раз тогда, когда Макс с грохотом швырнул на сукно выжившую стопку фишек. Этот смешок... прозвучал как пощёчина, окончательно выводя голландца из себя, в то время как самому Ландо было абсолютно плевать на исход партии, ведь его главной целью на сегодня явно был не выигрыш, а возможность позлить остальных и лишний раз сбежать к барной стойке.
Шарик сделал последний ленивый оборот, несколько раз нервно подпрыгнул между металлическими перегородками и с сухим щелчком замер.
– Зеро, зелёное, – спокойно объявил Пьер.
На несколько секунд за столом повисла тишина. Гасли молча выровнял стопку выигранных фишек идеально по краю стола, прежде чем подтолкнуть её к Джорджу.
– Да вы издеваетесь... – сквозь зубы процедил Макс.
Расселл лишь коротко усмехнулся, будто и сам не видел в происходящем ничего необычного. Он собрал выигрыш неспешно, почти лениво, словно подобный исход был самым естественным событием этого вечера.
– Кажется, я заразился его удачей, – протянул Ландо.
Спустя несколько секунд крупье подвинул часть банка и к нему. Норрис удивлённо моргнул, посмотрел сначала на фишки, потом на Джорджа и прыснул со смеху.
– Это точно заразно. Пьер, скажи честно... у вас тут скидка на удачу для британцев?
Пьер чуть приподнял голову.
– Или ты наконец-то научился играть? – невозмутимо бросил Джордж.
– Не порть момент, Расселл. Мне нравится версия с магией.

Француз едва заметно постучал костяшкой пальца по краю стола, привычным движением подталкивая фишки к игрокам.
– Ладно, – Джордж с тихим звоном опустил очередную стопку фишек поверх остальных. – Если тебя это настолько бесит, просто ставь так же, как я.
Макс недоверчиво сощурился.
– Серьёзно?
– А почему нет? Хуже уже всё равно не будет.
– Та ну… Не подсказывай ему, – фыркнул Ландо, лениво покачивая бокал. – Мне начинает нравиться этот сериал.
– Тогда вам стоит заказать второй напиток.
Спокойный голос Пьера прозвучал настолько неожиданно, что Ландо повернул голову к крупье. Француз даже не смотрел на него – не отрывая взгляда от колеса, машинально перебирал пальцами край стопки фишек в лотке. – Боюсь, шоу только начинается.
Ландо прыснул.
– Вот за это я тебя и люблю, Пьер.
– Благодарю. Но это не взаимно.
Джордж едва заметно опустил голову, пряча улыбку за краем бокала.
Макс раздражённо закатил глаза.
Они ещё и шутят...
Перед Максом практически бесшумно опустился тяжёлый стакан.
– Ваш виски.
Шарль. Уже убрал поднос обратно под руку.
Как и всегда, идеально выглаженная белая рубашка, чёрный жилет, серебристый поднос в руке и абсолютно невозмутимое, на первый взгляд, выражение лица.
– Благодарю.
Макс даже не посмотрел на него.
Шарль, однако, не спешил уходить. Его взгляд всего на мгновение встретился со взглядом Пьера. Тот едва заметно качнул головой.
Шарль выдохнул почти незаметно и лишь после этого спокойно направился обратно к бару.

– Так же, как я, – повторил Джордж.
Голландец наконец поднял голову.
– Что?
– Если хочешь выиграть.
Расселл спокойно пожал плечами.
– Просто ставь так же, как я.
Пьер, раскладывавший фишки предыдущего банка, на долю секунды замер. Совсем чуть-чуть.
Настолько, что заметить это мог только человек, уже ищущий подвох.
Но мысль оборвалась раньше. Казалось, вот оно. Ферстаппен наконец-то понял.
– А-а…
Не дожидаясь следующего раунда, Макс сгрёб остатки своих фишек и почти демонстративно бросил их на зеро. Глухой стук эхом разнёсся по столу.
Пьер поднял взгляд. Впервые за весь вечер идеально выверенная маска крупье дала почти незаметную трещину. Он медленно прикрыл глаза, и с его губ сорвалось почти беззвучное, сдавленное:
– Mon Dieu…
Джордж тоже замер. Кольцо впервые за вечер перестало вращаться.
– Макс…
– Ну что ещё?
– Я ещё не поставил.
Ландо медленно поставил бокал на стол.
Он посмотрел сначала на Макса. Потом на Джорджа. Опять на Макса.
– Ты сейчас серьёзно? Нет-нет... не отвечай.
– Но…
– Как я. А не как я ставил пять минут назад.

С другого конца зала донёсся тихий звон бокалов. Шарль, успевший дойти почти до бара, прикрыл глаза ладонью.
Карлос, протиравший стакан полотенцем, вопросительно поднял бровь.
– Что?
Леклер едва слышно выдохнул.
– Сейчас опять начнётся.
Карлос проследил за его взглядом. Увидел перекошенное лицо Макса. Спокойного Джорджа. Ландо, который уже начал складываться пополам от смеха.
И Пьера, сохранявшего настолько безупречное самообладание, что именно это выглядело самым подозрительным.
– Мне звать охрану?
– Пока нет.
– Бедный Пьер.
– Бедный стол, – машинально поправил Шарль.



– Восемь.
– Три.
Саинз даже головы не поднял, продолжая натирать бокал.
– Мы ведь сейчас на одно и то же ставим?
Шарль только устало выдохнул. Он достал из-под стойки стакан и сам налил себе воды.
– Я ставил на Пьера.
Карлос посмотрел на него.
– В плане?
– Сколько он ещё выдержит.
Карлос с нарочитой гордостью протёр очередной бокал до скрипа – с тех пор как его перевели с разноса подносов за стойку, он любил изображать из себя философа, наблюдающего с безопасной дистанции. Шарль, которому всё ещё приходилось лавировать между столиками, эту позицию откровенно не разделял.
Очередной стакан опустился под стол, а Саинз облегчённо опёрся руками на стойку и наконец поднял взгляд.
– А я на Макса.
Леклер обречённо хмыкнул и пожал плечами. Кубики льда в стакане тихо стукнулись о стенки, и Шарль машинально понизил голос.
– Шансы приблизительно одинаковые.
Несколько секунд оба молчали. Из VIP-зала донёсся очередной сухой стук фишек. Карлос покосился в ту сторону.
– Шарль?
– М?
– Ты хоть понимаешь, что они делают?
Шарль сделал глоток воды.
– Не совсем.
– Отлично. Значит, я не один.
– Но одно я понял.
– И что же?
Леклер промолчал несколько секунд. То ли действительно подбирал слова, то ли просто решил немного потянуть интригу. Его взгляд сам собой остановился на рулетке.
Пьер стоял к ним спиной. Всё такой же ровный. Всё такой же неподвижный. И по-прежнему не касался локтями стола. Именно это почему-то и бесило сильнее всего. Когда-то Пьер списал всё на привычку. Шарль давно перестал этому верить. Ага. Как же.
– Сейчас нас от побоища отделяет всего одна ошибка.
Карлос обречённо прикрыл глаза и тяжело вздохнул.
– Мне готовить лёд?
– М? Для коктейлей?
– Для синяков.

– Ну так что, Джорджи? Поделишься секретом? Или мне придётся выведывать его в более… приватной обстановке?
Ландо бесцеремонно подвинулся ближе, практически вжимаясь плечом в плечо Расселла.
Джордж даже бровью не повёл, лишь слегка отклонился назад, сохраняя дистанцию, и сухо отшутился:
– Боюсь, Норрис, приватная обстановка со мной обойдётся тебе дороже, чем весь твой сегодняшний банк.
– Вот же жадина.
Ландо разочарованно фыркнул, но отсаживаться не спешил. Вместо этого он серьёзно уставился на гору фишек перед Джорджем, и его голос на секунду потерял шутливый тон:
– Джордж, ты же понимаешь…
– Что третий раз подряд на зеро не проканает? – лениво перебил его Расселл. – Конечно понимаю. Я же не идиот.
И в этот момент Джордж улыбнулся – так чисто, невинно и по-ангельски, что у Ландо на секунду дёрнулся глаз.
– Я вообще-то хотел сказать другое.
– Тогда говори быстрее.
За столом послышался резкий, сухой стук – Пьер слишком поспешно, почти грубо выровнял стопку фишек. Его взгляд на долю секунды скользнул по плечу Норриса, вплотную прижатому к плечу Расселла, и губы француза сжались в идеально прямую, тонкую линию.
– Кому-то не мешало бы уже дать остальным играть.
Гасли едва заметно постучал костяшкой пальца по сукну, демонстративно держа вторую ладонь у обода колеса.
– Ставки не ждут, мистер Норрис, – ровно заметил он.
Ландо поднял руки в примирительном жесте.
– Всё-всё. Не ворчи.

На другом конце стола Ферстаппен с такой силой сжал стакан с виски, что ладонь побелела. Он багровел на глазах, глядя на то, как Ландо продолжает сидеть на подлокотнике дивана, едва ли не касаясь лица Расселла. Жар прилил к лицу, дыхание стало тяжёлым, а внутри всё скрутило от тупой, злой обиды.
– У… Сейчас точно рванёт, – тихо пробормотал Саинз, косясь на потемневшее лицо Макса, и превентивно достал из-под стойки чистый лёд.
Наблюдать за тем, как Ферстаппен сходит с ума из-за Расселла, должно было быть смешно. Карлосу вот, например, было. А у Шарля при взгляде на потемневшее лицо голландца почему-то сводило скулы.
Хотя будто и ничего такого. Просто очередной раздражённый клиент за столом… Шарль ведь именно так и решил ещё тогда – на следующее утро, когда встретил этот пустой, ничего не помнящий взгляд. И с тех пор это правило работало безотказно. Почти безотказно.
Шарль резко выдохнул, до белизны сжав пальцы на стакане, и заставил себя отвернуться к барной стойке. Не думать. Не вспоминать. Не хватало ещё, чтобы эта дверь распахнулась посреди рабочей смены.
Рядом тихо звякнуло стекло – Карлос, даже не глядя на него, молча пододвинул по стойке свежую салфетку и пару долек лайма, словно давая понюхать нашатырь. Шарль коротко кивнул в знак благодарности и перевёл взгляд на стол, всё ещё держа стакан в руке.

Расселл выглядел до раздражающего спокойным. Он явно был из тех, кого хочется или ударить, или поцеловать – смотря в какой части зала тебе довелось оказаться.
Даже теперь, когда Ландо практически висел у него на плече, Расселл выглядел так, будто происходящее его скорее утомляло, чем забавляло. И почему-то Шарлю казалось, что больше всего его раздражал не сам Норрис. А то, сколько времени тот отнимал у игры.
Британец на секунду посмотрел в сторону крупье, а затем скользнул куда-то дальше – к бару за спиной, где в этот самый миг тускло отразился в стекле неоновый свет.
Шарль невольно проследил за его взглядом. И вдруг поймал себя на мысли, что впервые за весь вечер ему действительно интересно, что выпадет дальше. Это ему совсем не понравилось. Ну давай. Посмотрим, что ты придумал.

После этого Джордж наконец перестал улыбаться. Даже Ландо перестал ёрзать на подлокотнике. Карлос за стойкой замер, и Шарль боковым зрением заметил, как испанец машинально отодвинул хрупкие бокалы подальше от края.
В VIP-зале вдруг стало слишком много тишины для такого места.
Собрав фишки одной рукой, Джордж спокойно подтянул к себе весь свой банк.
– Ладно. Хватит разговоров.
Одним плавным, оглушительным движением он протянул руку и спихнул все свои фишки вперёд. Огромная башня с грохотом рассыпалась по зелёному сукну.
Но не на зеро.



Пьер посмотрел на Джорджа.
Несколько фишек, сбившихся с общей стопки, продолжали катиться по зелёному сукну. Одна остановилась почти у самого края стола, другая задела соседнюю и изменила направление. Пьер машинально проследил за ними взглядом, прежде чем снова посмотреть на игрока.
Весь банк.
Джордж только что поставил на кон весь свой банк.
И выглядел при этом так, словно сделал нечто совершенно обыденное.
У Пьера на долю секунды свело скулы. Sans déconner…
Это было уже слишком. В этой игре никогда не бывает стопроцентной уверенности, даже когда кажется, что всё под контролем. А Расселл сейчас вёл себя так, словно собирался назло всем испытать судьбу на прочность. Чёртов идиот.

– Ты сейчас серьёзно? – первым нарушил вязкую тишину Ландо.
Он всё ещё находился рядом с Джорджем, но прежняя расслабленность куда-то исчезла. Сидеть на подлокотнике ему, видимо, больше не хотелось: теперь он стоял, слегка наклонившись к столу, и смотрел на рассыпанные фишки так, будто тот только что предложил поставить на собственную смерть.
– А что тебя смущает? – спросил Джордж.
– Весь банк, Расселл.
– Да я заметил.
Джордж улыбнулся.
– Если ты так переживаешь, я и тебе могу подсказать.
Ландо прищурился.
– Правда?
– Конечно. Сегодня у меня щедрое настроение.
– Какое счастье. А я-то думал, придётся самому думать.
Пьер коротко покосился на электронное табло у края стола, где всё ещё горели два зелёных нуля подряд, и вернул взгляд к игрокам.
– Если вы закончили, я бы хотел продолжить.
– Ц-ц-ц… Опять ворчишь, – протянул Ландо. Он отступил на полшага, но внимательного, прищуренного взгляда от Джорджа так и не отвёл. – Так на что ты всё-таки ставишь? Даже конкретную цифру не назовёшь? Вон, на табло два зеро подряд горят…
– Ты мне предлагаешь ещё и номер угадать? – Джордж лениво повёл бровью. – Я же не идиот. Скажу, допустим, восемнадцать – и пролечу. Так что просто на красное.
Гасли уточнил расположение фишек, выровнял их и ещё раз посмотрел на Джорджа.
– Весь банк?
– Именно.

Макс коротко хмыкнул в ладонь и усмехнулся.
– Гениально.
Джордж никак не отреагировал. Кажется, он даже не посмотрел в его сторону.
А сам Макс сидел напротив. Перед ним всё ещё лежала фишка, поставленная на зеро. Пьер помнил её с самого начала. Помнил и то, как уверенно Макс сделал этот выбор, словно остальные варианты даже не заслуживали внимания.
И с каждой секундой он смотрел на неё куда менее уверенно.
Ландо, напротив, не спешил отворачиваться. Его взгляд задержался на ставке Джорджа, затем переместился на саму рулетку. Он будто пытался найти в происходящем что-то, что ускользало от него самого.
– Что? – спросил Джордж.
– Ничего.
Ферстаппен сжал стакан. Лёд внутри глухо ударился о стекло.
Пьер заметил это движение, но ничего не сказал. Макс и без того выглядел так, будто каждое слово, произнесённое за последние несколько минут, было направлено лично против него.
Особенно если его произносил Ландо.
– Ну что, Норрис? – Пьер вернулся к делу. – Твоя очередь.
Ландо задержал взгляд на ставке Джорджа, затем перевёл его на собственные фишки. Ставить просто на цвет, судя по его хитрой ухмылке, показалось ему слишком скучным. В конце концов он небрежно бросил фишки ровно на линию между семнадцатью и двадцатью – на чёрный сплит.
– Уверен?
– Абсолютно.
– Принято. Ставок больше нет.

Крупье запустил рулетку.
Колесо пришло в движение. Он знал этот звук наизусть.
Лёгкий металлический стук, постепенно меняющийся по мере того, как шарик набирал скорость. Пьер следил за шариком, не отрывая взгляда. Знал, когда тот начинал замедляться, как менялся ритм, как долго обычно продолжалось вращение.
В этой работе многое зависело от точности: от положения рук, силы движения, правильного расчёта. Но исход всё равно оставался за пределами его контроля – слишком много случайностей, слишком большой зазор для ошибки. И сегодня эта ошибка обошлась бы слишком дорого.
Шарик перескакивал через деления, постепенно теряя скорость. Зашуршал по ободу, пролетая мимо красных, чёрных и обоих зелёных секторов.
Ландо следил за ним с нескрываемым интересом, чуть подавшись вперёд.
Макс, напротив, будто перестал замечать всё вокруг. Его взгляд метался между колесом и собственной фишкой, будто собирался лично заставить его остановиться на нужном числе.
Пьер отвёл глаза на мгновение.
Шарик продолжал вращаться.
Один оборот.
Второй.
Пьер чуть прищурился, улавливая момент, когда скорость начнёт падать. Ещё немного – и он должен будет объявить результат.

– Красный.
– Что, прости?
Шарль стоял перед ним, слегка склонив голову набок. Его взгляд был направлен куда-то ниже лица Пьера.
– Тебе больше шёл красный галстук. Чёрный слишком мрачный.
Пьер опустил глаза на собственную одежду.
– Ты сейчас серьёзно?
– А почему нет?
Шарль подошёл ближе и, не спрашивая разрешения, поправил узел галстука. Его пальцы задержались на ткани всего на несколько секунд, а взгляд вдруг стал серьёзнее.
– Ты точно уверен, что справишься? – тихо добавил он, уже без прежней улыбки. – Если что-то пойдёт не так…
– Всё под контролем, Шарль, – ровно отрезал Пьер, перехватывая его за запястье, прежде чем отпустить. – Не накручивай.
Леклер коротко выдохнул и едва заметно улыбнулся:
– Как скажешь. 
Шарик с сухим, звонким стуком ударился о край восемнадцатого сектора.
Время словно просело. Крошечный белый шар подпрыгнул на металлической перегородке, на долю секунды завис в воздухе, решая, куда сорваться – в глубину восемнадцатой лунки или наружу, в сторону соседнего чёрного сектора. У Пьера внутри всё оборвалось так резко, что перехватило дыхание. Только не в чёрное.
Макс подался вперёд, почти нависая над столом, с таким лицом, будто силой взгляда пытался столкнуть шарик в нужное ему русло. Ландо приоткрыл рот, едва не пискнув от внезапного азарта, – но в следующее мгновение шарик с тихим щелчком провалился в соседний, двадцать первый сектор.
Улыбка мгновенно сползла с лица Норриса. Он замер, переводя ошалелый взгляд с остановившегося колеса на свою фишку на линии между семнадцатью и двадцатью – буквально в паре сантиметров от выигрышного квадрата – и медленно выдохнул.
Merde… – едва не сорвалось с губ, но Пьер тут же прикусил язык, возвращая на лицо безупречное спокойствие, и опустил прозрачный маркер на выигрышный номер на сукне:
– Двадцать один, красное.

Несколько секунд никто не произносил ни слова.
– Да ладно, – выдохнул Ландо, наконец поднимая взгляд на лицо Расселла.
Джордж посмотрел на него.
– Бывает.
– Бывает?! – Ландо уставился на него. – Ты только что поставил весь банк!
– … И?
– И выиграл!
– Ну, я вижу.
– Ты вообще способен хоть чему-нибудь удивляться?
– Конечно.
– И чему же?
– Твоему удивлению.
Макс отвернулся, провёл ладонью по затылку и что-то пробормотал себе под нос.
– Уроды.
Ферстаппен с глухим, тяжёлым стуком опустил стакан на деревянный бортик стола. Звук вышел резким, сухим – по толстому стеклу у самого дна мгновенно расползлась тонкая, паутинная трещина, но бокал чудом не рассыпался.
Он даже не взглянул на него. Рывком поднялся с дивана, бросив на сукно последний злой взгляд – туда, где всё ещё лежала его одинокая, сгоревшая фишка на зеро, – и быстрым, тяжёлым шагом вышел из VIP-зала в сторону основного бара.
Ландо проводил его взглядом, перевёл глаза на оставшуюся на зелёном секторе фишку и с абсолютно счастливым видом протянул:
– Мгновенная карма. Потрясающе.
Он лениво потянулся, сгрёб со стола остаток своих фишек в карман пиджака и, глянув на гигантскую башню перед Джорджем, покачал головой с кривой усмешкой:
– Расселл, ты просто везучая скотина.
Джордж лишь лениво пожал плечами, даже не пытаясь спорить.
– Да ну вас. Скукотища. 
Норрис поднялся и направился к стойке, на ходу уже что-то весело бросая Карлосу.
Шум вокруг стих так же внезапно, как и начался. За столом остались только двое.
Пьер молча сгрёб проигравшие фишки с зеро и сплита, аккуратно убирая их в лоток. Внутри всё ещё гудел адреналин – слишком громко, слишком остро после того, как шарик едва не застрял в восемнадцатом секторе, – но внешне Гасли оставался всё тем же непроницаемым, выверенным до миллиметра дилером.
Рядом бесшумно возник Шарль. Он осторожно взял треснувший стакан за край, поставил его на серебристый поднос и задержался у стола на пару секунд дольше, чем требовала работа.
– Ты в порядке, mon ami? – тихо, почти одними губами спросил Леклер, наклоняясь чуть ближе, словно поправлял пепельницу у края стола. В его взгляде мелькнуло то самое тёплое, привычное беспокойство, от которого у Пьера всегда чуть отпускало тугой узел между лопаток.
– В полном, – так же тихо ответил Гасли, позволяя себе на долю секунды встретиться с ним глазами и едва заметно кивнуть. – Иди, пока Карлос там один не зашился.
Леклер коротко хмыкнул, бросил быстрый, оценивающий взгляд на Джорджа – без злости, скорее с лёгким предупреждением – и мягко отступил назад, растворяясь в полумраке зала.
Пьер выдохнул и перевёл взгляд на единственного оставшегося игрока.
Расселл сидел абсолютно спокойно, сцепив пальцы на колене. Ни самодовольной ухмылки, ни театральных жестов – теперь, когда зрители разошлись, маска богатого бездельника стала куда тоньше.
Гасли молча отсчитал из лотка гигантскую стопку фишек – выплату один к одному за весь этот безумный банк – и ровным, выверенным движением подвинул её через сукно, предварительно сняв прозрачный маркер с двадцать первого номера.
– Ваш выигрыш, мистер Расселл, – ровно произнёс Пьер. Голос звучал безупречно вежливо, холодно и отстранённо – ровно так, как требовали камеры под потолком. – Продолжите игру или на сегодня достаточно?
Джордж скользнул взглядом по аккуратным башням фишек, затем медленно поднял глаза на Пьера. В них не было ничего, что могло бы привлечь внимание службы безопасности, – только спокойная, чуть ленивая вежливость.
– Пожалуй, на сегодня достаточно, – негромко ответил британец, принимаясь неспешно перекладывать фишки в пластиковый лоток для кассы. – Не хочется испытывать ваше терпение сверх меры. Благодарю за отличную игру, Пьер.
– Всегда к вашим услугам, сэр.
Расселл поднялся, кивнул на прощание и неторопливой, уверенной походкой направился в сторону кассы.

Пьер проводил его спину неподвижным взглядом. Пальцы под краем стола на секунду сжались в кулак. Дождавшись сменщика и сдав стол, он вышел из зала с безупречной, ледяной выправкой — но стоило тяжёлой двери служебного коридора захлопнуться за спиной, как маска крупье наконец дала трещину. Гасли ускорил шаг с одним чётким, кристально ясным желанием добраться до Расселла и собственноручно свернуть ему шею. Желательно медленно.

const chapters = {
1: { meta: 'Глава I · POV Max', title: 'Счастливчик' },
2: { meta: 'Глава II · POV Charles', title: 'Ставка' },
3: { meta: 'Глава III · POV Pierre', title: 'Сплит' }
};
let currentChapter = 1;
function formatText(rawText) {
const blocks = rawText.trim().split(/\n\s*\n/);
return blocks.map((block, index) => {
const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
const paragraphs = lines.map(line => {
const formattedLine = line.replace(/*(.*?)*/g, '$1');
const isDialogue = /^[–—-]/.test(line);
return <p class="${isDialogue ? 'dialogue' : ''}">${formattedLine}</p>;
}).join('');
const divider = index < blocks.length - 1 ? '♦ ♦ ♦' : '';
return <div class="scene-block">${paragraphs}</div>${divider};
}).join('');
}
function loadChapter(num) {
if (!chapters[num]) return;
currentChapter = num;
document.getElementById('chapterMeta').textContent = chapters[num].meta;
document.getElementById('chapterTitle').textContent = chapters[num].title;
document.getElementById('mobileHeaderTitle').textContent = ${num}. ${chapters[num].title};
const raw = document.getElementById(text-${num}).innerHTML;
document.getElementById('chapterBody').innerHTML = formatText(raw);
document.querySelectorAll('.nav-item').forEach(el => {
el.classList.toggle('active', Number(el.dataset.chapter) === num);
});
document.getElementById('prevBtn').disabled = num === 1;
document.getElementById('nextBtn').disabled = !chapters[num + 1];
window.scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('sidebar').classList.remove('open');
}
function changeChapter(delta) {
loadChapter(currentChapter + delta);
}
function toggleSidebar() {
document.getElementById('sidebar').classList.toggle('open');
}
window.addEventListener('scroll', () => {
const scrollTop = window.scrollY;
const docHeight = document.documentElement.scrollHeight - window.innerHeight;
const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
document.getElementById('progressBar').style.width = ${progress}%;
});
document.addEventListener('keydown', (e) => {
if (
(e.ctrlKey || e.metaKey) &&
['c', 'C', 'с', 'С', 'a', 'A', 'ф', 'Ф', 's', 'S', 'ы', 'Ы', 'u', 'U', 'г', 'Г', 'p', 'P', 'з', 'З'].includes(e.key)
) {
e.preventDefault();
}
if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase()))) {
e.preventDefault();
}
if (e.key === 'PrintScreen') {
enableBlur();
}
});
const wrapper = document.getElementById('mainWrapper');
const banner = document.getElementById('shieldBanner');
function enableBlur() {
wrapper.classList.add('blurred');
banner.style.display = 'block';
}
function disableBlur() {
wrapper.classList.remove('blurred');
banner.style.display = 'none';
}
window.addEventListener('blur', enableBlur);
window.addEventListener('focus', disableBlur);
document.addEventListener('visibilitychange', () => {
document.hidden ? enableBlur() : disableBlur();
});
loadChapter(1);
